# Puerto del BFF
# ──── Springdoc OpenAPI Configuration ────

# Usa el openapi.yaml como source de verdad en lugar de generar automáticamente
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.use-root-path=true

# Carga el openapi.yaml personalizado
springdoc.api-docs.location=classpath:/openapi.yaml

# Configuración de Swagger UI
springdoc.swagger-ui.show-common-extensions=true
springdoc.swagger-ui.deep-linking=true
springdoc.swagger-ui.display-operation-id=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.max-displayed-tags=10
springdoc.swagger-ui.show-extensions=true

# Permite que Swagger UI intente preautenticar con cookies
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.csrf.enabled=false

server.port=8080

# URLs de los microservicios
ms.usuarios.url=${MS_USUARIOS_URL:http://localhost:8081}
ms.reportes.url=${MS_REPORTES_URL:http://localhost:8082}
ms.alertas.url=${MS_ALERTAS_URL:http://localhost:8083}

# CORS
cors.allowed.origins=${CORS_ORIGINS:http://localhost:3000}

# Cookie JWT
jwt.cookie.name=access_token
jwt.cookie.maxage=86400
jwt.secret=${JWT_SECRET}

# Necesario para usar webflux (WebClient) con servidor servlet (Spring MVC)
spring.main.web-application-type=servlet

# ─── Actuator (health checks para Kubernetes) ────────────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

# ─── Circuit Breaker – Resilience4j ──────────────────────────────────────────
resilience4j.circuitbreaker.instances.ms-reportes.sliding-window-size=10
resilience4j.circuitbreaker.instances.ms-reportes.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.ms-reportes.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.ms-reportes.permitted-number-of-calls-in-half-open-state=3

resilience4j.circuitbreaker.instances.ms-usuarios.sliding-window-size=10
resilience4j.circuitbreaker.instances.ms-usuarios.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.ms-usuarios.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.ms-usuarios.permitted-number-of-calls-in-half-open-state=3

resilience4j.circuitbreaker.instances.ms-alertas.sliding-window-size=10
resilience4j.circuitbreaker.instances.ms-alertas.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.ms-alertas.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.ms-alertas.permitted-number-of-calls-in-half-open-state=3
