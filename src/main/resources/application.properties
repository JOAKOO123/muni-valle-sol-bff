# Puerto del BFF
server.port=8080

# URLs de los microservicios
ms.usuarios.url=${MS_USUARIOS_URL:http://localhost:8081}
ms.reportes.url=${MS_REPORTES_URL:http://localhost:8082}
ms.alertas.url=${MS_ALERTAS_URL:http://localhost:8083}
ms.brigadas.url=${MS_BRIGADAS_URL:http://localhost:8084}

# CORS
cors.allowed.origins=${CORS_ORIGINS:http://localhost:3000}

# Cookie JWT (la cookie que el BFF entrega al navegador del frontend)
jwt.cookie.name=access_token
jwt.cookie.maxage=86400
jwt.cookie.secure=${JWT_COOKIE_SECURE:false}

# Necesario para usar webflux (WebClient) con servidor servlet (Spring MVC)
spring.main.web-application-type=servlet

# ─── Actuator (health checks para Kubernetes) ────────────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# ──── Springdoc OpenAPI Configuration ────
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.use-root-path=true
springdoc.api-docs.location=classpath:/openapi.yaml
springdoc.swagger-ui.show-common-extensions=true
springdoc.swagger-ui.deep-linking=true
springdoc.swagger-ui.display-operation-id=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.max-displayed-tags=10
springdoc.swagger-ui.show-extensions=true
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.csrf.enabled=false